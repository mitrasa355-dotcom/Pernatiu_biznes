<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пернатый Бизнес</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.adsgram.ai/js/sdk.min.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(ellipse at top, #2d1b4e 0%, #0f0a1e 60%);
            color: #fff; margin: 0; padding: 12px 12px 100px; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 440px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 12px; }
        .header h1 { font-size: 22px; margin: 0;
            background: linear-gradient(90deg, #ffd700, #ff9800);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .card { background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));
            border-radius: 20px; padding: 16px; margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.08); backdrop-filter: blur(10px); }
        .top-wallets { display: flex; gap: 8px; margin-bottom: 12px; }
        .wallet { flex: 1; background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,152,0,0.05));
            border-radius: 16px; padding: 12px; text-align: center;
            border: 1px solid rgba(255,215,0,0.2); }
        .wallet.feather { background: linear-gradient(135deg, rgba(156,39,176,0.2), rgba(103,58,183,0.08));
            border-color: rgba(156,39,176,0.3); }
        .wallet-label { font-size: 11px; color: #bbb; letter-spacing: 1px; text-transform: uppercase; }
        .wallet-value { font-size: 22px; font-weight: 800; color: #ffd700; margin-top: 2px; }
        .wallet.feather .wallet-value { color: #ce93d8; }
        .income-badge { display: block; font-size: 11px; color: #4CAF50; margin-top: 4px; font-weight: 600; }

        .energy-bar { background: rgba(255,255,255,0.08); border-radius: 10px; height: 8px; overflow: hidden; margin-top: 8px; }
        .energy-fill { background: linear-gradient(90deg, #ffd700, #ff9800); height: 100%; transition: width 0.3s; }
        .energy-text { font-size: 11px; color: #aaa; text-align: center; margin-top: 4px; }

        .farm-area { text-align: center; padding: 20px 16px;
            background: linear-gradient(180deg, rgba(76,175,80,0.15), rgba(76,175,80,0.03));
            border: 1px solid rgba(76,175,80,0.2); border-radius: 20px; margin-bottom: 12px; }
        .bird { font-size: 90px; cursor: pointer; user-select: none; display: inline-block;
            transition: transform 0.08s; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.4));
            animation: bob 2.5s ease-in-out infinite; }
        @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
        .bird:active { transform: scale(0.9); animation: none; }
        .bird-name { font-size: 16px; font-weight: 700; margin-top: 6px; }
        .tap-hint { font-size: 12px; color: #888; margin-top: 4px; }

        .btn { display: block; width: 100%; padding: 14px; border-radius: 14px;
            font-size: 15px; font-weight: 700; cursor: pointer; border: none;
            margin-bottom: 8px; transition: transform 0.08s; font-family: inherit; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; }
        .btn-primary { background: linear-gradient(135deg, #4CAF50, #388E3C); color: #fff; }
        .btn-gold { background: linear-gradient(135deg, #ffd700, #ff9800); color: #1a1a2e; }
        .btn-purple { background: linear-gradient(135deg, #9c27b0, #673ab7); color: #fff; }
        .btn-withdraw { background: linear-gradient(135deg, #ff5722, #d32f2f); color: #fff; }
        .btn-daily { background: linear-gradient(135deg, #2196F3, #1976D2); color: #fff; }

        .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab { flex: 1; padding: 10px; background: rgba(255,255,255,0.05);
            border-radius: 12px; text-align: center; cursor: pointer;
            font-size: 13px; font-weight: 600; border: 1px solid transparent; transition: all 0.2s; }
        .tab.active { background: rgba(255,215,0,0.15); border-color: rgba(255,215,0,0.4); color: #ffd700; }

        .shop-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .shop-item { background: rgba(255,255,255,0.05); border-radius: 14px; padding: 10px 6px;
            text-align: center; border: 1px solid rgba(255,255,255,0.08); }
        .shop-item .icon { font-size: 32px; }
        .shop-item .name { font-size: 11px; color: #ccc; margin-top: 2px; }
        .shop-item .price-s { font-size: 11px; color: #ffd700; font-weight: 700; margin-top: 4px; cursor: pointer;
            padding: 4px; border-radius: 6px; background: rgba(255,215,0,0.1); }
        .shop-item .price-f { font-size: 11px; color: #ce93d8; font-weight: 700; margin-top: 3px; cursor: pointer;
            padding: 4px; border-radius: 6px; background: rgba(156,39,176,0.15); }
        .shop-item .count { font-size: 10px; color: #4CAF50; font-weight: 700; margin-top: 2px; }
        .shop-item.owned { border-color: rgba(76,175,80,0.4); }

        .leaderboard-row { display: flex; align-items: center; padding: 8px 10px; border-radius: 10px;
            background: rgba(255,255,255,0.04); margin-bottom: 6px; font-size: 13px; }
        .leaderboard-row.me { background: rgba(255,215,0,0.15); border: 1px solid rgba(255,215,0,0.3); }
        .rank { font-weight: 800; width: 30px; text-align: center; }
        .rank.gold { color: #ffd700; }
        .rank.silver { color: #c0c0c0; }
        .rank.bronze { color: #cd7f32; }
        .lb-user { flex: 1; margin-left: 8px; font-family: monospace; font-size: 12px; }
        .lb-value { font-weight: 700; color: #ffd700; }
        .lb-reward { font-size: 10px; color: #ce93d8; margin-left: 6px; }

        .section-title { font-size: 13px; font-weight: 700; color: #aaa;
            text-transform: uppercase; letter-spacing: 1px; margin: 0 0 10px; }
        .achievements { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ach { background: rgba(255,255,255,0.04); border-radius: 12px; padding: 8px 4px;
            text-align: center; border: 1px solid rgba(255,255,255,0.06); opacity: 0.4; transition: all 0.3s; }
        .ach.unlocked { opacity: 1; border-color: rgba(255,215,0,0.4);
            background: rgba(255,215,0,0.08); box-shadow: 0 0 12px rgba(255,215,0,0.2); }
        .ach .icon { font-size: 24px; }
        .ach .name { font-size: 10px; color: #ccc; margin-top: 2px; line-height: 1.2; }

        .status { font-size: 12px; color: #888; text-align: center; margin-top: 6px; min-height: 16px; }
        .saved { color: #4CAF50; } .saving { color: #ffd700; } .error { color: #f44336; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
            align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal.active { display: flex; }
        .modal-box { background: linear-gradient(135deg, #1e1533, #0f0a1e); border-radius: 20px;
            padding: 24px; width: 100%; max-width: 360px; border: 1px solid rgba(255,215,0,0.2); }
        .modal-box h2 { margin: 0 0 12px; font-size: 20px; color: #ffd700; }
        .modal-box p { font-size: 14px; color: #ccc; margin: 8px 0; }
        .modal-box input { width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);
            color: #fff; font-size: 13px; margin: 10px 0; font-family: inherit; }
        .modal-box .row { display: flex; gap: 8px; margin-top: 10px; }
        .modal-box .row .btn { width: 50%; margin: 0; }
        .btn-cancel { background: #333; color: #fff; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: linear-gradient(135deg, #4CAF50, #388E3C); color: #fff;
            padding: 12px 24px; border-radius: 30px; font-weight: 700; z-index: 2000;
            transition: transform 0.4s; box-shadow: 0 8px 24px rgba(76,175,80,0.5); font-size: 14px; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.achievement { background: linear-gradient(135deg, #ffd700, #ff9800); color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>🐔 Пернатый Бизнес</h1></div>

        <div class="top-wallets">
            <div class="wallet">
                <div class="wallet-label">🪙 Суета</div>
                <div class="wallet-value" id="balance">...</div>
                <span class="income-badge" id="income">+0/час</span>
            </div>
            <div class="wallet feather">
                <div class="wallet-label">🪶 Перья</div>
                <div class="wallet-value" id="feathers">0</div>
                <span class="income-badge" id="feathers-hint" style="color:#ce93d8;">для вывода</span>
            </div>
        </div>

        <div class="card farm-area">
            <div class="bird" id="bird" onclick="tapBird()">🐔</div>
            <div class="bird-name" id="bird-name">Курица</div>
            <div class="energy-bar"><div class="energy-fill" id="energy-fill" style="width:100%"></div></div>
            <div class="energy-text"><span id="energy-text">1000/1000</span> энергии</div>
        </div>

        <div class="card">
            <button class="btn btn-primary" id="adBtn" onclick="watchAd()">📺 Смотреть рекламу (+80 суеты +2 🪶)</button>
            <button class="btn btn-daily" id="dailyBtn" onclick="claimDaily()">🎁 Ежедневный бонус</button>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('shop', this)">🛒 Магазин</div>
            <div class="tab" onclick="switchTab('lb', this)">🏆 Лидеры</div>
        </div>

        <div class="card" id="tab-shop">
            <div class="section-title">Купить птиц</div>
            <div class="shop-grid">
                <div class="shop-item" id="shop-chicken">
                    <div class="icon">🐔</div>
                    <div class="name">Курица</div>
                    <div class="price-s" onclick="buyBird('chicken','sueta')">500 🪙</div>
                    <div class="price-f" onclick="buyBird('chicken','feather')">10 🪶</div>
                    <div class="count" id="cnt-chicken"></div>
                </div>
                <div class="shop-item" id="shop-duck">
                    <div class="icon">🦆</div>
                    <div class="name">Утка</div>
                    <div class="price-s" onclick="buyBird('duck','sueta')">5000 🪙</div>
                    <div class="price-f" onclick="buyBird('duck','feather')">100 🪶</div>
                    <div class="count" id="cnt-duck"></div>
                </div>
                <div class="shop-item" id="shop-goose">
                    <div class="icon">🦢</div>
                    <div class="name">Гусь</div>
                    <div class="price-s" onclick="buyBird('goose','sueta')">25000 🪙</div>
                    <div class="price-f" onclick="buyBird('goose','feather')">500 🪶</div>
                    <div class="count" id="cnt-goose"></div>
                </div>
            </div>
        </div>

        <div class="card" id="tab-lb" style="display:none;">
            <div class="section-title">🏆 Топ недели по суете</div>
            <div id="lb-sueta"></div>
            <div class="section-title" style="margin-top:14px;">🐔 Топ по покупкам птиц</div>
            <div id="lb-birds"></div>
        </div>

        <div class="card">
            <div class="section-title">🏆 Достижения</div>
            <div class="achievements" id="achievements"></div>
        </div>

        <div class="card">
            <button class="btn btn-withdraw" onclick="openWithdraw()">💸 Вывести TON</button>
            <div class="status" id="status"></div>
        </div>
    </div>

    <div class="modal" id="withdrawModal">
        <div class="modal-box">
            <h2>💸 Вывод TON</h2>
            <p id="wd-info">Перьев: ...</p>
            <p style="font-size:12px;color:#888;">Минимум: 100 🪶 = 0.1 TON</p>
            <input type="text" id="wd-wallet" placeholder="Адрес TON-кошелька (UQ... или EQ...)" />
            <div class="row">
                <button class="btn btn-cancel" onclick="closeWithdraw()">Отмена</button>
                <button class="btn btn-withdraw" id="wd-submit" onclick="submitWithdraw()">Отправить</button>
            </div>
            <div class="status" id="wd-status"></div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); tg.ready();
        const API = "https://pernatiubiznes.mitrasa355.workers.dev";
        const userId = tg.initDataUnsafe?.user?.id || "guest";
        const AD_LIMIT = 10;
        const MIN_FEATHERS = 100;
        const FEATHERS_PER_TON = 1000;
        const ENERGY_BASE = 60;
const ENERGY_RECOVER_SEC = 60; // 1 энергия в минуту
const ENERGY_PER_BIRD = { chicken: 2, duck: 10, goose: 40 };

function calcMaxEnergy() {
    let max = ENERGY_BASE;
    for (const key in userData.birds) {
        if (ENERGY_PER_BIRD[key]) max += ENERGY_PER_BIRD[key] * userData.birds[key];
    }
    return max;
}

        // ⚠️ ЗАМЕНИТЕ НА НОВЫЙ ID БЛОКА ИЗ ADSGRAM ПОСЛЕ ОДОБРЕНИЯ МОДЕРАЦИИ
        const BLOCK_ID = "54253"; 

        const BIRDS = {
            chicken: { name: "🐔 Курица", priceS: 500,   priceF: 10,  income: 10  },
            duck:    { name: "🦆 Утка",   priceS: 5000,  priceF: 100, income: 50  },
            goose:   { name: "🦢 Гусь",   priceS: 25000, priceF: 500, income: 200 }
        };

        const ACHIEVEMENTS = [
            { id: "first_bird",  icon: "🐣", name: "Первая птица", check: d => totalBirds(d) >= 1,  reward: { s: 100, f: 2 } },
            { id: "ten_birds",   icon: "🐥", name: "Птичий двор",  check: d => totalBirds(d) >= 10, reward: { s: 500, f: 5 } },
            { id: "fifty_birds", icon: "🦅", name: "Фермер",       check: d => totalBirds(d) >= 50, reward: { s: 2000, f: 15 } },
            { id: "rich_10k",    icon: "💰", name: "10K суеты",    check: d => d.balance >= 10000, reward: { s: 1000, f: 5 } },
            { id: "rich_100k",   icon: "💎", name: "100K суеты",   check: d => d.balance >= 100000, reward: { s: 5000, f: 20 } },
            { id: "tapper",      icon: "👆", name: "100 тапов",    check: d => d.totalTaps >= 100, reward: { s: 200, f: 3 } }
        ];

        let userData = {
            balance: 0, feathers: 0,
            birds: { chicken: 0, duck: 0, goose: 0 },
            lastDailyBonus: 0, dailyStreak: 0, achievements: [],
            totalTaps: 0, totalEarned: 0,
            energy: 1000, energyUpdatedAt: Date.now(),
            adsToday: 0, adsDate: new Date().toDateString(),
            weeklySueta: 0, weeklyBirds: 0,
            lastSeen: Date.now(),
            userName: "Игрок", username: ""
        };

        let lastSync = 0;

        function totalBirds(d) {
            return (d.birds?.chicken || 0) + (d.birds?.duck || 0) + (d.birds?.goose || 0);
        }
        function showToast(text, type) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.className = 'toast show ' + (type || '');
            setTimeout(() => t.className = 'toast ' + (type || ''), 2500);
        }

        async function loadFromServer() {
            setStatus("Загрузка...", "");
            try {
                const r = await fetch(API + "/balance?user=" + userId);
                const data = await r.json();
                userData = { ...userData, ...data };
                if (userData.adsDate !== new Date().toDateString()) {
                    userData.adsToday = 0;
                    userData.adsDate = new Date().toDateString();
                }
                recalcEnergy();
                if (userData.lastSeen) {
                    const hours = Math.min((Date.now() - userData.lastSeen) / 1000 / 3600, 24);
                    const inc = calculateIncome() * hours;
                    if (inc > 0) userData.balance += Math.floor(inc);
                }
                userData.lastSeen = Date.now();
                updateUI();
                setStatus("✅ Данные загружены", "saved");
            } catch (e) {
                setStatus("⚠️ Оффлайн режим", "error");
            }
        }

        async function saveToServer() {
            userData.lastSeen = Date.now();
            setStatus("Сохранение...", "saving");
            try {
                const r = await fetch(API + "/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId, balance: Math.floor(userData.balance),
                        feathers: userData.feathers,
                        birds: userData.birds,
                        lastDailyBonus: userData.lastDailyBonus,
                        dailyStreak: userData.dailyStreak,
                        achievements: userData.achievements,
                        totalTaps: userData.totalTaps,
                        totalEarned: userData.totalEarned,
                        energy: userData.energy,
                        energyUpdatedAt: userData.energyUpdatedAt,
                        weeklySueta: userData.weeklySueta,
                        weeklyBirds: userData.weeklyBirds,
                        userName: tg.initDataUnsafe?.user?.first_name || "Игрок",
                        username: tg.initDataUnsafe?.user?.username || ""
                    })
                });
                if (r.ok) { lastSync = Date.now(); setStatus("✅ Сохранено", "saved"); }
            } catch (e) { setStatus("⚠️ Нет связи", "error"); }
        }

        function calculateIncome() {
            let total = 0;
            for (const k in userData.birds) if (BIRDS[k]) total += BIRDS[k].income * userData.birds[k];
            return total;
        }

        function recalcEnergy() {
            const now = Date.now();
            const secs = Math.floor((now - (userData.energyUpdatedAt || now)) / 1000);
            const gained = Math.floor(secs / ENERGY_RECOVER_SEC);
            if (gained > 0) {
                userData.energy = Math.min(calcMaxEnergy(), (userData.energy || 0) + gained);
                userData.energyUpdatedAt = now;
            }
        }

        function updateUI() {
            recalcEnergy();
            document.getElementById('balance').textContent = Math.floor(userData.balance).toLocaleString('ru-RU');
            document.getElementById('feathers').textContent = Math.floor(userData.feathers || 0);
            const inc = calculateIncome();
            document.getElementById('income').textContent = '+' + inc + '/час';

            const maxE = calcMaxEnergy();
const enPct = ((userData.energy || 0) / maxE) * 100;
document.getElementById('energy-fill').style.width = enPct + '%';
document.getElementById('energy-text').textContent = Math.floor(userData.energy || 0) + '/' + maxE;
            for (const key in BIRDS) {
                const cnt = userData.birds[key] || 0;
                const el = document.getElementById('cnt-' + key);
                if (el) el.textContent = cnt > 0 ? '×' + cnt : '';
            }
            renderAchievements();
        }

        function renderAchievements() {
            const container = document.getElementById('achievements');
            let html = '';
            for (const ach of ACHIEVEMENTS) {
                const unlocked = userData.achievements.includes(ach.id) || ach.check(userData);
                if (unlocked && !userData.achievements.includes(ach.id)) {
                    userData.achievements.push(ach.id);
                    userData.balance += ach.reward.s;
                    userData.feathers = (userData.feathers || 0) + ach.reward.f;
                    setTimeout(() => showToast('🏆 ' + ach.name + '! +' + ach.reward.s + '🪙 +' + ach.reward.f + '🪶', 'achievement'), 500);
                    saveToServer();
                }
                html += `<div class="ach ${unlocked ? 'unlocked' : ''}">
                    <div class="icon">${ach.icon}</div>
                    <div class="name">${ach.name}</div>
                </div>`;
            }
            container.innerHTML = html;
        }

        function setStatus(t, c) {
            const el = document.getElementById('status');
            el.textContent = t; el.className = 'status ' + (c || '');
        }

        function tapBird() {
            if ((userData.energy || 0) <= 0) {
                tg.showAlert('Энергия закончилась! Восстанавливается 1 ед. за 10 сек.');
                return;
            }
            userData.energy -= 1;
            userData.balance += 1;
            userData.totalTaps = (userData.totalTaps || 0) + 1;
            userData.weeklySueta = (userData.weeklySueta || 0) + 1;
            userData.energyUpdatedAt = userData.energyUpdatedAt || Date.now();
            updateUI();
            tg.HapticFeedback?.impactOccurred('light');
        }

        function buyBird(type, currency) {
            const bird = BIRDS[type];
            if (!bird) return;
            const price = currency === 'sueta' ? bird.priceS : bird.priceF;
            const wallet = currency === 'sueta' ? 'balance' : 'feathers';
            if ((userData[wallet] || 0) < price) {
                tg.showAlert('Недостаточно ' + (currency === 'sueta' ? 'суеты' : 'перьев'));
                return;
            }
            userData[wallet] -= price;
            userData.birds[type] = (userData.birds[type] || 0) + 1;
            userData.weeklyBirds = (userData.weeklyBirds || 0) + 1;
            updateUI(); saveToServer();
            tg.HapticFeedback?.impactOccurred('medium');
            showToast(bird.name + ' куплена!');
        }

        function claimDaily() {
            const hours = (Date.now() - (userData.lastDailyBonus || 0)) / 3600000;
            if (hours < 20) {
                tg.showAlert('Бонус через ' + Math.ceil(20 - hours) + ' ч.');
                return;
            }
            if (hours > 48) userData.dailyStreak = 0;
            userData.dailyStreak = Math.min((userData.dailyStreak || 0) + 1, 7);
            const s = userData.dailyStreak * 10;
            const f = userData.dailyStreak;
            userData.balance += s;
            userData.feathers = (userData.feathers || 0) + f;
            userData.lastDailyBonus = Date.now();
            updateUI(); saveToServer();
            tg.HapticFeedback?.notificationOccurred('success');
            showToast('🎁 День ' + userData.dailyStreak + ': +' + s + '🪙 +' + f + '🪶');
        }

        let AdController = null;
        try { if (window.Adsgram) AdController = window.Adsgram.init({ blockId: BLOCK_ID }); } catch (e) {}

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            if (userData.adsToday >= AD_LIMIT) { tg.showAlert('Лимит рекламы: ' + AD_LIMIT + '/день'); return; }
            if (!AdController) { tg.showAlert('Реклама не загрузилась'); return; }
            btn.disabled = true;
            try {
                await AdController.show();
                userData.balance += 80;
                userData.feathers = (userData.feathers || 0) + 2;
                userData.weeklySueta = (userData.weeklySueta || 0) + 80;
                userData.adsToday++;
                updateUI(); saveToServer();
                showToast('📺 +80🪙 +2🪶');
            } catch (e) { setStatus("Реклама не показалась", "error"); }
            finally { btn.disabled = false; }
        }

        function switchTab(name, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('tab-shop').style.display = name === 'shop' ? 'block' : 'none';
            document.getElementById('tab-lb').style.display = name === 'lb' ? 'block' : 'none';
            if (name === 'lb') loadLeaderboard();
        }

        async function loadLeaderboard() {
            const rewards = [50, 30, 20, 5, 5, 5, 5, 5, 5, 5];
            try {
                const [r1, r2] = await Promise.all([
                    fetch(API + "/leaderboard?type=sueta").then(r => r.json()),
                    fetch(API + "/leaderboard?type=birds").then(r => r.json())
                ]);
                document.getElementById('lb-sueta').innerHTML = renderLB(r1, rewards, "🪙", v => v + " суеты");
                document.getElementById('lb-birds').innerHTML = renderLB(r2, rewards, "🐔", v => v + " птиц");
            } catch (e) { console.log(e); }
        }

        function renderLB(arr, rewards, unit, fmt) {
            if (!arr || !arr.length) return '<p style="color:#888;font-size:13px;">Пока никого нет</p>';
            const medals = ['🥇','🥈','🥉'];
            let html = '';
            arr.forEach((row, i) => {
                const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
                const isMe = String(row.userId) === String(userId);
                const medal = medals[i] || (i + 1);
                const reward = rewards[i] || 0;
                const displayName = isMe ? 'Ты' : (row.username ? '@' + row.username : (row.userName || 'Игрок'));
                html += `<div class="leaderboard-row ${isMe ? 'me' : ''}">
                    <div class="rank ${rankClass}">${medal}</div>
                    <div class="lb-user">${displayName}</div>
                    <div class="lb-value">${fmt(row.value)}</div>
                    ${reward ? `<div class="lb-reward">+${reward}🪶</div>` : ''}
                </div>`;
            });
            return html;
        }

        function openWithdraw() {
            if ((userData.feathers || 0) < MIN_FEATHERS) {
                tg.showAlert('Минимум ' + MIN_FEATHERS + ' перьев');
                return;
            }
            document.getElementById('wd-info').textContent = 'У тебя ' + Math.floor(userData.feathers) + ' 🪶 (' + (userData.feathers / FEATHERS_PER_TON).toFixed(4) + ' TON)';
            document.getElementById('wd-wallet').value = '';
            document.getElementById('wd-status').textContent = '';
            document.getElementById('withdrawModal').classList.add('active');
        }
        function closeWithdraw() { document.getElementById('withdrawModal').classList.remove('active'); }

        async function submitWithdraw() {
            const wallet = document.getElementById('wd-wallet').value.trim();
            const st = document.getElementById('wd-status');
            const btn = document.getElementById('wd-submit');
            if (!wallet || wallet.length < 40) { st.textContent = '⚠️ Проверь адрес'; st.className = 'status error'; return; }
            if ((userData.feathers || 0) < MIN_FEATHERS) { st.textContent = '⚠️ Мало перьев'; st.className = 'status error'; return; }
            const feathers = Math.floor(userData.feathers);
            btn.disabled = true;
            st.textContent = 'Отправка...'; st.className = 'status saving';
            try {
                const r = await fetch(API + "/withdraw", {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ userId, wallet, feathers })
                });
                const res = await r.json();
                if (r.ok && res.ok) {
                    st.textContent = '✅ Заявка создана!'; st.className = 'status saved';
                    userData.feathers = 0;
                    updateUI(); saveToServer();
                    setTimeout(closeWithdraw, 2500);
                } else { st.textContent = '⚠️ ' + (res.error || 'Ошибка'); st.className = 'status error'; }
            } catch (e) { st.textContent = '⚠️ Нет связи'; st.className = 'status error'; }
            finally { btn.disabled = false; }
        }

        function tick() {
            const inc = calculateIncome();
            if (inc > 0) userData.balance += inc / 3600;
            recalcEnergy();
            updateUI();
        }
        function autoSave() { if (Date.now() - lastSync > 25000) saveToServer(); }

        (async () => {
            await loadFromServer();
            setInterval(tick, 1000);
            setInterval(autoSave, 30000);
        })();

        window.addEventListener('beforeunload', () => {
            const blob = new Blob([JSON.stringify({
                userId, balance: Math.floor(userData.balance),
                feathers: userData.feathers, birds: userData.birds,
                lastDailyBonus: userData.lastDailyBonus, dailyStreak: userData.dailyStreak,
                achievements: userData.achievements, totalTaps: userData.totalTaps,
                totalEarned: userData.totalEarned, energy: userData.energy,
                energyUpdatedAt: userData.energyUpdatedAt,
                weeklySueta: userData.weeklySueta, weeklyBirds: userData.weeklyBirds,
                userName: tg.initDataUnsafe?.user?.first_name || "Игрок",
                username: tg.initDataUnsafe?.user?.username || ""
            })], { type: 'application/json' });
            navigator.sendBeacon(API + "/update", blob);
        });
    </script>
</body>
</html>
