<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пернатый Бизнес</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.adsgram.ai/js/sdk.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 24px; margin: 10px 0; }
        .balance { font-size: 32px; font-weight: bold; color: #ffd700; }
        .bird { font-size: 60px; margin: 15px 0; cursor: pointer; transition: transform 0.1s; user-select: none; }
        .bird:active { transform: scale(1.2); }
        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-ad { background: #4CAF50; color: white; }
        .btn:disabled { opacity: 0.6; }
        .status { font-size: 13px; color: #aaa; margin-top: 10px; min-height: 18px; }
        .birds-info { font-size: 13px; color: #ccc; margin-top: 8px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐔 Пернатый Бизнес</h1>
        <div class="balance" id="balance">0 суеты</div>
        <div style="font-size: 14px; color: #aaa;" id="income">Доход: 0/час</div>
        <div class="birds-info" id="birds-info"></div>
    </div>

    <div class="card">
        <div class="bird" id="bird" onclick="tapBird()">🐔</div>
        <div id="bird-name">Курица</div>
    </div>

    <div class="card">
        <button class="btn btn-ad" id="adBtn" onclick="watchAd()">📺 Смотреть рекламу (+100)</button>
        <button class="btn" onclick="buyBird('chicken')">🐔 Купить курицу (100)</button>
        <button class="btn" onclick="buyBird('duck')">🦆 Купить утку (1000)</button>
        <button class="btn" onclick="buyBird('goose')">🦢 Купить гуся (5000)</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Уникальный ключ для игрока (чтобы у разных людей был свой прогресс)
        const userId = tg.initDataUnsafe?.user?.id || "guest";
        const STORAGE_KEY = "pernatiy_biznes_" + userId;

        // Цены и доход птиц
        const BIRDS = {
            chicken: { name: "🐔 Курица", price: 100,  income: 10  },
            duck:    { name: "🦆 Утка",   price: 1000, income: 50  },
            goose:   { name: "🦢 Гусь",   price: 5000, income: 200 }
        };

        // Загружаем сохранённые данные или создаём новые
        let userData = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    // Начисляем пассивный доход за время отсутствия
                    if (data.lastSeen) {
                        const now = Date.now();
                        const hours = Math.min((now - data.lastSeen) / 1000 / 3600, 24);
                        const income = calculateIncome(data.birds);
                        data.balance += Math.floor(income * hours);
                    }
                    data.lastSeen = Date.now();
                    return data;
                }
            } catch (e) {
                console.log("Ошибка загрузки:", e);
            }
            return {
                balance: 100,
                birds: { chicken: 0, duck: 0, goose: 0 },
                lastSeen: Date.now()
            };
        }

        function saveData() {
            userData.lastSeen = Date.now();
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(userData));
            } catch (e) {
                console.log("Ошибка сохранения:", e);
            }
        }

        function calculateIncome(birds) {
            let total = 0;
            for (const key in birds) {
                if (BIRDS[key]) total += BIRDS[key].income * birds[key];
            }
            return total;
        }

        function updateUI() {
            document.getElementById('balance').textContent = userData.balance + ' суеты';
            const income = calculateIncome(userData.birds);
            document.getElementById('income').textContent = 'Доход: ' + income + '/час';

            // Показываем список купленных птиц
            let info = [];
            for (const key in userData.birds) {
                if (userData.birds[key] > 0) {
                    info.push(BIRDS[key].name + ": " + userData.birds[key] + " шт");
                }
            }
            document.getElementById('birds-info').textContent = info.join(" • ");
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function tapBird() {
            userData.balance += 1;
            updateUI();
            saveData();
        }

        function buyBird(type) {
            const bird = BIRDS[type];
            if (!bird) return;
            if (userData.balance >= bird.price) {
                userData.balance -= bird.price;
                userData.birds[type] += 1;
                updateUI();
                saveData();
                tg.showAlert('Куплено: ' + bird.name);
            } else {
                tg.showAlert('Недостаточно суеты! Нужно ' + bird.price);
            }
        }

        // ==== ADSGRAM ====
        const BLOCK_ID = "53750";
        let AdController = null;
        try {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ blockId: BLOCK_ID });
                console.log("Adsgram готов");
            } else {
                console.log("Adsgram SDK не загрузился");
            }
        } catch (e) {
            console.log("Ошибка Adsgram:", e);
        }

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            if (!AdController) {
                tg.showAlert('Реклама пока не загрузилась. Попробуй позже.');
                return;
            }
            btn.disabled = true;
            setStatus("Загрузка рекламы...");
            try {
                const result = await AdController.show();
                console.log("Реклама просмотрена:", result);
                userData.balance += 100;
                updateUI();
                saveData();
                setStatus("✅ +100 суеты!");
                tg.showAlert('Спасибо за просмотр! +100 суеты');
            } catch (err) {
                console.log("Ошибка показа рекламы:", err);
                setStatus("Реклама не показалась. Попробуй позже.");
            } finally {
                btn.disabled = false;
            }
        }

        // Сохраняем данные при закрытии Mini App
        window.addEventListener('beforeunload', saveData);

        // Автосохранение каждые 30 секунд
        setInterval(saveData, 30000);

        updateUI();
    </script>
</body>
</html>
