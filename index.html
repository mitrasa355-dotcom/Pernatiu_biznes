<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пернатый Бизнес</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.adsgram.ai/js/sdk.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 20px 20px 80px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 22px; margin: 8px 0; }
        .balance { font-size: 32px; font-weight: bold; color: #ffd700; }
        .ton-eq { font-size: 13px; color: #4CAF50; margin-top: 4px; }
        .bird { font-size: 60px; margin: 15px 0; cursor: pointer; transition: transform 0.1s; user-select: none; }
        .bird:active { transform: scale(1.2); }
        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 6px;
            width: 85%;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-ad { background: #4CAF50; color: white; }
        .btn-withdraw { background: #ff9800; color: white; }
        .btn:disabled { opacity: 0.5; }
        .status { font-size: 12px; color: #888; margin-top: 10px; min-height: 16px; }
        .birds-info { font-size: 13px; color: #ccc; margin-top: 8px; line-height: 1.6; }
        .saved { color: #4CAF50; }
        .saving { color: #ffd700; }
        .error { color: #f44336; }

        /* Модальное окно */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-box {
            background: #1a1a2e;
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        .modal-box h2 { margin: 0 0 12px; font-size: 20px; }
        .modal-box p { font-size: 14px; color: #ccc; margin: 8px 0; }
        .modal-box input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
            margin: 10px 0;
        }
        .modal-box .row { display: flex; gap: 8px; margin-top: 10px; }
        .modal-box .row .btn { width: 50%; margin: 0; }
        .btn-cancel { background: #444; color: #fff; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐔 Пернатый Бизнес</h1>
        <div class="balance" id="balance">...</div>
        <div class="ton-eq" id="ton-eq"></div>
        <div style="font-size: 14px; color: #aaa; margin-top: 6px;" id="income">Доход: 0/час</div>
        <div class="birds-info" id="birds-info"></div>
    </div>

    <div class="card">
        <div class="bird" id="bird" onclick="tapBird()">🐔</div>
        <div id="bird-name">Курица</div>
    </div>

    <div class="card">
        <button class="btn btn-ad" id="adBtn" onclick="watchAd()">📺 Смотреть рекламу (+100)</button>
        <button class="btn" onclick="buyBird('chicken')">🐔 Курица (100)</button>
        <button class="btn" onclick="buyBird('duck')">🦆 Утка (1000)</button>
        <button class="btn" onclick="buyBird('goose')">🦢 Гусь (5000)</button>
        <button class="btn btn-withdraw" onclick="openWithdraw()">💸 Вывести TON</button>
        <div class="status" id="status"></div>
    </div>

    <!-- Модальное окно вывода TON -->
    <div class="modal" id="withdrawModal">
        <div class="modal-box">
            <h2>💸 Вывод TON</h2>
            <p id="wd-balance">Баланс: ...</p>
            <p id="wd-min">Минимум: 5000 суеты = 0.1 TON</p>
            <input type="text" id="wd-wallet" placeholder="Адрес TON-кошелька (UQ... или EQ...)" />
            <p style="font-size: 12px; color: #888;">Введи адрес своего кошелька Tonkeeper или Telegram Wallet</p>
            <div class="row">
                <button class="btn btn-cancel" onclick="closeWithdraw()">Отмена</button>
                <button class="btn btn-withdraw" id="wd-submit" onclick="submitWithdraw()">Отправить</button>
            </div>
            <div class="status" id="wd-status"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const API = "https://pernatiubiznes.mitrasa355.workers.dev";
        const userId = tg.initDataUnsafe?.user?.id || "guest";
        const DAILY_AD_LIMIT = 10;
        const SUETA_PER_TON = 50000;
        const MIN_WITHDRAW = 5000;

        const BIRDS = {
            chicken: { name: "🐔 Курица", price: 100,  income: 10  },
            duck:    { name: "🦆 Утка",   price: 1000, income: 50  },
            goose:   { name: "🦢 Гусь",   price: 5000, income: 200 }
        };

        let userData = {
            balance: 100,
            birds: { chicken: 0, duck: 0, goose: 0 },
            lastSeen: Date.now(),
            adsToday: 0,
            adsDate: new Date().toDateString()
        };

        let lastSync = 0;

        // ========== ЗАГРУЗКА С СЕРВЕРА ==========
        async function loadFromServer() {
            setStatus("Загрузка...", "");
            try {
                const r = await fetch(API + "/balance?user=" + userId);
                const data = await r.json();
                userData = { ...userData, ...data };
                if (userData.adsDate !== new Date().toDateString()) {
                    userData.adsToday = 0;
                    userData.adsDate = new Date().toDateString();
                }
                if (userData.lastSeen) {
                    const now = Date.now();
                    const hours = Math.min((now - userData.lastSeen) / 1000 / 3600, 24);
                    const inc = calculateIncome() * hours;
                    if (inc > 0) userData.balance += Math.floor(inc);
                }
                userData.lastSeen = Date.now();
                updateUI();
                setStatus("✅ Данные загружены", "saved");
            } catch (e) {
                console.log("Ошибка загрузки:", e);
                setStatus("⚠️ Оффлайн режим", "error");
            }
        }

        // ========== СОХРАНЕНИЕ НА СЕРВЕР ==========
        async function saveToServer() {
            userData.lastSeen = Date.now();
            setStatus("Сохранение...", "saving");
            try {
                const r = await fetch(API + "/update", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: userId,
                        balance: Math.floor(userData.balance),
                        birds: userData.birds
                    })
                });
                if (r.ok) {
                    lastSync = Date.now();
                    setStatus("✅ Сохранено", "saved");
                } else {
                    setStatus("⚠️ Ошибка сохранения", "error");
                }
            } catch (e) {
                console.log("Ошибка сохранения:", e);
                setStatus("⚠️ Нет связи", "error");
            }
        }

        // ========== РАСЧЁТЫ ==========
        function calculateIncome() {
            let total = 0;
            for (const key in userData.birds) {
                if (BIRDS[key]) total += BIRDS[key].income * userData.birds[key];
            }
            return total;
        }

        function updateUI() {
            document.getElementById('balance').textContent = Math.floor(userData.balance) + ' суеты';
            const ton = (userData.balance / SUETA_PER_TON).toFixed(4);
            document.getElementById('ton-eq').textContent = '≈ ' + ton + ' TON';
            const inc = calculateIncome();
            document.getElementById('income').textContent = 'Доход: ' + inc + '/час';
            let info = [];
            for (const key in userData.birds) {
                if (userData.birds[key] > 0) info.push(BIRDS[key].name + ": " + userData.birds[key]);
            }
            document.getElementById('birds-info').textContent = info.join(" • ");
        }

        function setStatus(text, cls) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.className = 'status ' + (cls || '');
        }

        // ========== ДЕЙСТВИЯ ==========
        function tapBird() {
            userData.balance += 1;
            updateUI();
        }

        function buyBird(type) {
            const bird = BIRDS[type];
            if (!bird) return;
            if (userData.balance >= bird.price) {
                userData.balance -= bird.price;
                userData.birds[type] += 1;
                updateUI();
                saveToServer();
            } else {
                tg.showAlert('Недостаточно суеты! Нужно ' + bird.price);
            }
        }

        // ========== РЕКЛАМА ==========
        const BLOCK_ID = "53750";
        let AdController = null;
        try {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ blockId: BLOCK_ID });
            }
        } catch (e) { console.log("Adsgram error:", e); }

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            if (userData.adsToday >= DAILY_AD_LIMIT) {
                tg.showAlert('Лимит рекламы на сегодня: ' + DAILY_AD_LIMIT);
                return;
            }
            if (!AdController) {
                tg.showAlert('Реклама пока не загрузилась. Попробуй позже.');
                return;
            }
            btn.disabled = true;
            setStatus("Загрузка рекламы...", "");
            try {
                await AdController.show();
                userData.balance += 100;
                userData.adsToday++;
                updateUI();
                saveToServer();
                tg.showAlert('Спасибо! +100 суеты');
            } catch (err) {
                console.log("Ошибка показа:", err);
                setStatus("Реклама не показалась", "error");
            } finally {
                btn.disabled = false;
            }
        }

        // ========== ВЫВОД TON ==========
        function openWithdraw() {
            if (userData.balance < MIN_WITHDRAW) {
                tg.showAlert('Минимум для вывода: ' + MIN_WITHDRAW + ' суеты (0.1 TON)');
                return;
            }
            const balanceTon = (userData.balance / SUETA_PER_TON).toFixed(4);
            document.getElementById('wd-balance').textContent = 'Баланс: ' + Math.floor(userData.balance) + ' суеты (≈ ' + balanceTon + ' TON)';
            document.getElementById('wd-wallet').value = '';
            document.getElementById('wd-status').textContent = '';
            document.getElementById('withdrawModal').classList.add('active');
        }

        function closeWithdraw() {
            document.getElementById('withdrawModal').classList.remove('active');
        }

        async function submitWithdraw() {
            const wallet = document.getElementById('wd-wallet').value.trim();
            const wdStatus = document.getElementById('wd-status');
            const btn = document.getElementById('wd-submit');

            if (!wallet || wallet.length < 40) {
                wdStatus.textContent = '⚠️ Проверь адрес кошелька';
                wdStatus.className = 'status error';
                return;
            }

            if (userData.balance < MIN_WITHDRAW) {
                wdStatus.textContent = '⚠️ Недостаточно суеты';
                wdStatus.className = 'status error';
                return;
            }

            const amountTon = +(userData.balance / SUETA_PER_TON).toFixed(4);
            btn.disabled = true;
            wdStatus.textContent = 'Отправка заявки...';
            wdStatus.className = 'status saving';

            try {
                const r = await fetch(API + "/withdraw", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        userId: userId,
                        wallet: wallet,
                        amountTon: amountTon
                    })
                });
                const res = await r.json();
                if (r.ok && res.ok) {
                    wdStatus.textContent = '✅ Заявка создана! Ожидай выплату до 24 часов';
                    wdStatus.className = 'status saved';
                    userData.balance = 0;
                    updateUI();
                    saveToServer();
                    setTimeout(closeWithdraw, 2500);
                } else {
                    wdStatus.textContent = '⚠️ Ошибка: ' + (res.error || 'попробуй позже');
                    wdStatus.className = 'status error';
                }
            } catch (e) {
                console.log("Withdraw error:", e);
                wdStatus.textContent = '⚠️ Нет связи с сервером';
                wdStatus.className = 'status error';
            } finally {
                btn.disabled = false;
            }
        }

        // ========== ТИК ПАССИВНОГО ДОХОДА ==========
        function tick() {
            const inc = calculateIncome();
            if (inc > 0) {
                userData.balance += inc / 3600;
                updateUI();
            }
        }

        function autoSave() {
            if (Date.now() - lastSync > 25000) saveToServer();
        }

        // ========== ЗАПУСК ==========
        (async () => {
            await loadFromServer();
            setInterval(tick, 1000);
            setInterval(autoSave, 30000);
        })();

        window.addEventListener('beforeunload', () => {
            const blob = new Blob([JSON.stringify({
                userId: userId,
                balance: Math.floor(userData.balance),
                birds: userData.birds
            })], { type: 'application/json' });
            navigator.sendBeacon(API + "/update", blob);
        });
    </script>
</body>
</html>
