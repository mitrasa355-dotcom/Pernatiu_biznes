<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Пернатый Бизнес</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://sdk.adsgram.ai/js/sdk.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
            width: 90%;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 { font-size: 24px; margin: 10px 0; }
        .balance { font-size: 32px; font-weight: bold; color: #ffd700; }
        .bird { font-size: 60px; margin: 15px 0; cursor: pointer; transition: transform 0.1s; user-select: none; }
        .bird:active { transform: scale(1.2); }
        .btn {
            background: #ffd700;
            color: #1a1a2e;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            width: 80%;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-ad { background: #4CAF50; color: white; }
        .btn:disabled { opacity: 0.6; }
        .status { font-size: 13px; color: #aaa; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🐔 Пернатый Бизнес</h1>
        <div class="balance" id="balance">0 суеты</div>
        <div style="font-size: 14px; color: #aaa;" id="income">Доход: 0/час</div>
    </div>

    <div class="card">
        <div class="bird" id="bird" onclick="tapBird()">🐔</div>
        <div id="bird-name">Курица</div>
    </div>

    <div class="card">
        <button class="btn btn-ad" id="adBtn" onclick="watchAd()">📺 Смотреть рекламу (+100)</button>
        <button class="btn" onclick="buyBird()">🛒 Купить курицу (100)</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        let userData = {
            balance: 100,
            birds: { chicken: 0, duck: 0, goose: 0 },
            incomePerHour: 0
        };

        // ==== ИНИЦИАЛИЗАЦИЯ РЕКЛАМЫ ADSGRAM ====
        const BLOCK_ID = "53750";
        let AdController = null;
        try {
            if (window.Adsgram) {
                AdController = window.Adsgram.init({ blockId: BLOCK_ID });
                console.log("Adsgram готов");
            } else {
                console.log("Adsgram SDK не загрузился");
            }
        } catch (e) {
            console.log("Ошибка инициализации Adsgram:", e);
        }

        function updateUI() {
            document.getElementById('balance').textContent = userData.balance + ' суеты';
            document.getElementById('income').textContent = 'Доход: ' + userData.incomePerHour + '/час';
        }

        function setStatus(text) {
            document.getElementById('status').textContent = text;
        }

        function tapBird() {
            userData.balance += 1;
            updateUI();
        }

        function buyBird() {
            if (userData.balance >= 100) {
                userData.balance -= 100;
                userData.birds.chicken += 1;
                userData.incomePerHour += 10;
                updateUI();
            } else {
                tg.showAlert('Недостаточно суеты!');
            }
        }

        async function watchAd() {
            const btn = document.getElementById('adBtn');
            if (!AdController) {
                tg.showAlert('Реклама пока не загрузилась. Попробуй позже.');
                return;
            }
            btn.disabled = true;
            setStatus("Загрузка рекламы...");
            try {
                const result = await AdController.show();
                // Игрок досмотрел рекламу
                console.log("Реклама просмотрена:", result);
                userData.balance += 100;
                updateUI();
                setStatus("✅ +100 суеты!");
                tg.showAlert('Спасибо за просмотр! +100 суеты');
            } catch (err) {
                console.log("Ошибка показа рекламы:", err);
                setStatus("Реклама не показалась. Попробуй позже.");
            } finally {
                btn.disabled = false;
            }
        }

        updateUI();
    </script>
</body>
</html>
